services:
  postgres:
    image: postgres:16-alpine
    container_name: na_prancheta_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: na_prancheta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
