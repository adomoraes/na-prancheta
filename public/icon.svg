<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado com borda sutil -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Campo de Futebol / Prancheta Estilizada -->
  <g transform="translate(64, 56)">
    <!-- Base da Prancheta -->
    <rect x="0" y="30" width="384" height="370" rx="32" fill="url(#pitchGrad)" stroke="#10b981" stroke-width="6" stroke-opacity="0.8" />
    
    <!-- Linhas do Campo -->
    <!-- Borda interna -->
    <rect x="24" y="54" width="336" height="322" rx="16" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.6" />
    <!-- Linha do meio campo -->
    <line x1="24" y1="215" x2="360" y2="215" stroke="#34d399" stroke-width="4" stroke-opacity="0.6" />
    <!-- Círculo central -->
    <circle cx="192" cy="215" r="48" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.6" />
    <circle cx="192" cy="215" r="5" fill="#34d399" />
    <!-- Área Superior -->
    <rect x="120" y="54" width="144" height="60" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.6" />
    <!-- Área Inferior -->
    <rect x="120" y="316" width="144" height="60" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.6" />

    <!-- Clip / Grampo da Prancheta no Topo -->
    <rect x="128" y="10" width="128" height="36" rx="10" fill="#27272a" stroke="#52525b" stroke-width="4" />
    <rect x="156" y="2" width="72" height="18" rx="6" fill="#10b981" />

    <!-- Elementos Táticos (X e O em ação) -->
    <!-- Jogadores X (Ataque) -->
    <path d="M80 140 L104 164 M104 140 L80 164" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <path d="M260 130 L284 154 M284 130 L260 154" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <path d="M180 270 L204 294 M204 270 L180 294" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

    <!-- Jogadores O (Defesa) -->
    <circle cx="130" cy="280" r="14" fill="none" stroke="#38bdf8" stroke-width="5" />
    <circle cx="260" cy="280" r="14" fill="none" stroke="#38bdf8" stroke-width="5" />
    
    <!-- Seta de Movimento Tático -->
    <path d="M104 152 Q 150 170 180 200" fill="none" stroke="#10b981" stroke-width="5" stroke-dasharray="8 6" />
    <polygon points="185,195 186,206 175,203" fill="#10b981" />
  </g>
</svg>
